org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true

# No AndroidX, no Kotlin, no support library. The whole app is plain framework
# Java against the platform SDK, which is what keeps the APK in the tens of
# kilobytes rather than the low megabytes.
