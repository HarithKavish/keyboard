name: Build

on:
  push:
    branches: [main, development, feature/claude]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # AGP 8.x requires JDK 17. The app itself still targets API 21
          # devices; the JDK version only governs the build.
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Each step below is separate so a failure names the stage that broke.
      # None of them swallow errors: there is no `|| true` anywhere in this
      # file, so a lint error, a failing test or a broken build fails the run.
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report APK size
        run: ./gradlew reportApkSize --no-daemon

      - name: Collect the APK
        id: collect
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was produced under app/build/outputs/apk/debug"
            exit 1
          fi
          # Publish under a predictable name regardless of the variant filename.
          mkdir -p artifacts
          cp "$APK_PATH" artifacts/glass-keyboard-debug.apk
          SIZE_BYTES=$(stat -c %s artifacts/glass-keyboard-debug.apk)
          echo "apk_path=artifacts/glass-keyboard-debug.apk" >> "$GITHUB_OUTPUT"
          {
            echo "### Debug APK"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            echo "| glass-keyboard-debug.apk | $(numfmt --to=iec --suffix=B "$SIZE_BYTES") |"
            echo ""
            echo "Small is the point: see AGENTS.md before adding a dependency."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-keyboard-debug-apk
          path: ${{ steps.collect.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      # Reports are uploaded even on failure, because that is exactly when the
      # lint HTML and the test XML are worth reading.
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-keyboard-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
